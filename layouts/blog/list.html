{{ define "main" }}
  <h1>Blog</h1>

  <p>Research notes, essays, and open questions.</p>

  <!-- 新しい記事は content/blog/日付/ にHTMLファイルを作成してください。 -->
  <ul class="post-list">
    {{ range .Pages.ByDate.Reverse }}
      <li>
        <time>{{ .Date.Format "January 2, 2006" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
{{ end }}
